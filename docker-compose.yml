services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]   # not exposed to the internet
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on: [mongo]
  caddy:                              # automatic HTTPS (needed by the phone app)
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: [DOMAIN=${DOMAIN}]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [backend]
volumes:
  mongo_data: {}
  caddy_data: {}
  caddy_config: {}
